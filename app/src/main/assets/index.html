<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#06171c;color:#edf4f5;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;max-width:760px;margin:auto;padding:6px 10px;background:linear-gradient(160deg,#09232a,#06171c 70%);display:flex;flex-direction:column}
.summaryBox{flex:0 0 76px;border:1px solid #a07b20;border-radius:17px;background:#0a222a;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8px 13px;margin-bottom:6px}
.summaryLabel{display:block;color:#9fb2b7;font-size:12px}
.summaryValue{display:flex;align-items:center;color:#ffc34a;font-size:30px;font-weight:900;white-space:nowrap}

.pencil{margin-left:2px;width:30px;height:30px;border:1px solid #31515a;border-radius:9px;background:#0e2a32;color:#e6f0f1}
.summaryInfo{text-align:right;color:#9fb2b7;font-size:10px;line-height:1.55}
.insideHistory{height:29px;padding:0 10px;border:1px solid #3d5961;border-radius:9px;background:#0b222a;color:#d6b55a;font-size:11px;font-weight:900}
.orders{min-height:0;flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.order{height:108px;min-height:108px;border:1px solid #5b9367;border-radius:17px;background:#071e25;padding:8px 10px;display:grid;grid-template-rows:28px 36px 36px}

.badge{padding:3px 7px;border-radius:999px;background:#183b2a;color:#8fc49a;font-size:10px;font-weight:900}
.ue,.num{font-size:17px;font-weight:900}.timer,.price{color:#ffc34a;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-size:22px}.price{font-size:22px}
.moneyRow{height:36px;display:flex;align-items:center;gap:7px}
.editFee,.delete{height:32px;padding:0 9px;border-radius:9px;font-size:11px;font-weight:900}
.editFee{border:1px solid #3b5961;background:#102a32;color:#dce8ea}
.delete{border:1px solid #70414a;background:#21171b;color:#ff8991}
.line2{height:36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}
.note{height:32px;min-width:0;border:1px solid #1d3842;border-radius:9px;background:#061720;color:#dbe6e9;padding:4px 8px;font-size:12px;outline:0}
.complete{height:32px;padding:0 12px;border:1px solid #547e5b;border-radius:9px;background:#3f6b48;color:#f1f5f1;font-size:12px;font-weight:900}
.start{flex:0 0 58px;height:58px;margin:5px 0;border:1px solid #547e5b;border-radius:15px;background:#3f6b48;color:#f2f8f6;font-size:21px;font-weight:900}
.todayBar{flex:0 0 45px;height:45px;border:1px solid #284c56;border-radius:13px;background:#091f27;display:flex;align-items:center;justify-content:space-around}
.todayBar>span{flex:1;text-align:center;min-width:0}.todayBar>i{width:1px;height:26px;background:#284c56}
.todayBar small{display:block;color:#91a5ab;font-size:9px}.todayBar b{display:block;color:#ffc34a;font-size:15px;margin-top:1px}
.empty{flex:1;border:1px dashed #31545b;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8da2a8;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end;justify-content:center;padding:7px}
.panel{width:min(720px,100%);height:calc(100dvh - 14px);background:#0d252d;border:1px solid #38545e;border-radius:20px;padding:9px 10px;display:flex;flex-direction:column}
.panelHead{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0;font-size:20px}.closeX{border:0;background:none;color:#9fb1b7;font-size:25px}
.dateNav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-top:2px}.dateArrow{height:32px;border:1px solid #38545e;border-radius:10px;background:#0b1d25;color:#ffc54e;font-size:28px}.periodDate{border:0;background:none;color:#f0f6f7;font-size:15px;font-weight:900}
.todayBtn{margin:1px auto 0;height:22px;padding:0 12px;border:1px solid #38545e;border-radius:999px;background:#0b1d25;color:#9fb0b5;font-size:10px}
.tabs{display:flex;gap:6px;margin-top:4px}.tab{flex:1;height:32px;border:1px solid #38545e;border-radius:9px;background:#0b1d25;color:#91a5ac;font-weight:800}.tab.active{background:#3f6b48;color:#f0f7f5;border-color:#2b8e6e}
.statsCards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.statCard{border:1px solid #31515a;border-radius:11px;background:#091f27;padding:6px;text-align:center}.statCard span{display:block;color:#91a5ab;font-size:10px}.statCard b{display:block;color:#ffc34a;font-size:18px;margin-top:1px}
.workTimeNote{text-align:center;color:#718990;font-size:9px;padding:4px 0}
.historySummary{display:grid;grid-template-columns:1fr 1fr;gap:6px}.historySummary>div{border:1px solid #31515a;border-radius:11px;background:#091f27;padding:6px;text-align:center}.historySummary span{display:block;color:#91a5ab;font-size:10px}.historySummary b{display:block;color:#ffc34a;font-size:17px}
.historyList{overflow:auto;margin-top:4px;flex:1}
.day{color:#ffc34a;font-weight:900;font-size:11px;padding:6px 2px 3px}
.hist{display:grid;grid-template-columns:minmax(105px,1fr) 54px 156px 53px;gap:3px;align-items:center;min-height:86px;padding:7px 0;border-bottom:1px solid rgba(96,137,145,.28)}
.histOrder{font-size:18px;font-weight:900}.histOrder small{display:block;margin-top:4px;color:#94a9ae;font-size:12px;font-weight:500;white-space:nowrap}
.histDuration{text-align:center}.histDuration small,.histMoney small{display:block;color:#94a9ae;font-size:9px}.histDuration strong{font-size:15px}
.histMoney{display:grid;grid-template-columns:55px 20px 78px;grid-template-rows:20px 28px;align-items:center;text-align:center}
.histMoney small:first-child{grid-column:1;grid-row:1}.histMoney b{grid-column:1;grid-row:2;color:#ffc34a;font-size:15px}.histMoney em{grid-column:2;grid-row:1/3;font-style:normal;color:#dce6e8;font-size:21px}.histMoney small:nth-of-type(2){grid-column:3;grid-row:1}.histMoney strong{grid-column:3;grid-row:2;color:#6fc78a;font-size:15px}
.histDelete{width:53px;height:37px;border:1px solid #7f3e4c;border-radius:9px;background:#21171b;color:#ff8991;font-size:12px;font-weight:900}
.confirmModal,.feeModal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:20px}.confirmBox,.feeBox{width:min(390px,100%);background:#0b252c;border:1px solid #2d7063;border-radius:18px;padding:18px;box-shadow:0 16px 45px #0009}.confirmTitle,.feeTitle{font-size:18px;font-weight:900;margin-bottom:7px}.confirmText,.feeTip{color:#b5c5c9;font-size:13px;line-height:1.6}.confirmActions,.feeActions{display:flex;gap:8px;margin-top:15px}.confirmActions button,.feeActions button{flex:1;height:44px;border-radius:11px;font-weight:900}.confirmCancel,.feeCancel{border:1px solid #31515a;background:#0a1d24;color:#cbd7da}.confirmYes,.feeSave{border:0;background:#c94650;color:#fff}.feeSave{background:#3f6b48}
@media(max-width:390px){.hist{grid-template-columns:minmax(92px,1fr) 52px 132px 46px}.histMoney{grid-template-columns:52px 16px 78px}.histMoney b,.histMoney strong{font-size:14px}.histDelete{width:46px}.price{font-size:20px}}

/* ===== Mobile UI stability patch ===== */

/* 歷史訂單：把所有固定高度與大留白壓縮，讓常見的 4 筆訂單能在一個手機畫面完整看到 */
.modal{padding:4px}

.statsCards{gap:5px;margin-top:4px}
.statCard{padding:5px;border-radius:10px}

/* 每筆歷史訂單固定為 62px 左右，不需要上下捲動即可看到常見的多筆訂單 */
.historyList .day{font-size:9px;padding:3px 2px 1px;line-height:12px}
.historyList .hist{
  grid-template-columns:minmax(92px,1fr) 48px minmax(124px,1.05fr) 43px!important;
  column-gap:3px!important;
  min-height:61px!important;
  height:61px!important;
  padding:4px 0!important;
}
.histOrder{font-size:15px;line-height:18px;min-width:0}
.histOrder small{font-size:9px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histDuration small,.histMoney small{font-size:8px;line-height:11px}
.histDuration strong{font-size:13px;line-height:17px}
.histMoney{
  grid-template-columns:48px 15px 68px!important;
  grid-template-rows:16px 22px!important;
  column-gap:0!important;
  min-width:0;
}
.histMoney b,.histMoney strong{font-size:12px;line-height:20px}
.histMoney em{font-size:17px;line-height:20px}
.histDelete{width:43px;height:31px;font-size:10px;padding:0}

/* 小螢幕再縮一級，避免 360px 寬手機出現橫向擠壓 */
@media(max-width:380px){
  .app{padding-left:7px;padding-right:7px}
  .summaryBox{grid-template-columns:minmax(0,1fr) 112px;padding-left:9px;padding-right:9px}
  .summaryValue{font-size:25px}
  .summaryValue input{font-size:25px;width:49px}
  .summaryInfo{font-size:9px}
  .insideHistory{font-size:10px;padding:0 7px}
  .order{padding-left:7px;padding-right:7px}
  .line1{gap:4px}
  .ue,.num{font-size:15px}
  .timer,.price{font-size:19px}
  .editFee,.delete{font-size:10px;padding:0 7px}
  .complete{font-size:11px;padding:0 9px}
  .todayBar small{font-size:8px}
  .todayBar b{font-size:13px}
  .historyList .hist{
    grid-template-columns:minmax(82px,1fr) 44px minmax(116px,1fr) 40px!important;
  }
  .histMoney{grid-template-columns:44px 13px 65px!important}

}

</div></div>

<div class="confirmModal" id="abandonModal"><div class="confirmBox"><div class="confirmTitle">放棄這筆訂單？</div><div class="confirmText">放棄後不會計入收入，也不會算完成單。</div><div class="confirmActions"><button class="confirmCancel" id="abandonCancel">取消</button><button class="confirmYes" id="abandonYes">放棄此單</button></div></div></div>
<div class="confirmModal" id="historyDeleteModal"><div class="confirmBox"><div class="confirmTitle">刪除歷史訂單？</div><div class="confirmText" id="historyDeleteText"></div><div class="confirmActions"><button class="confirmCancel" id="historyDeleteCancel">取消</button><button class="confirmYes" id="historyDeleteYes">確定刪除</button></div></div></div>
<div class="feeModal" id="feeModal"><div class="feeBox"><div class="feeTitle">修改訂單金額</div><div class="confirmText" id="feeOrderLabel"></div><div style="display:flex;align-items:center;margin-top:10px;border:1px solid #31515a;border-radius:11px;padding:7px 10px"><b style="color:#ffc34a">NT$</b><input id="feeInput" type="number" min="45" step="1" style="width:100%;border:0;outline:0;background:transparent;color:#ffc34a;font-size:25px;font-weight:900"></div><div class="feeTip">輸入平台實際顯示的報酬，計時不會重新開始。</div><div class="feeActions"><button class="feeCancel" id="feeCancel">取消</button><button class="feeSave" id="feeSave">套用金額</button></div></div></div>

<script>
const KEY="delivery_pro_orders_v3", GUARANTEE=245;
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), abandonTarget=null, feeTarget=null, historyDeleteTarget=null;
let historyMode="today", selectedDate=new Date(); selectedDate.setHours(0,0,0,0);
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function active(){return data.filter(o=>!o.deleted&&!o.completedAt).slice(-4)}
function money(o){return Math.max(Number(o.baseFee||45),GUARANTEE*Math.max(0,(Date.now()-o.start)/3600000))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function pad(n){return String(n).padStart(2,"0")}
function dateText(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`}
function isSameDay(ts){return new Date(ts).toDateString()===selectedDate.toDateString()}
function weekStart(){let d=new Date(selectedDate),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d}
function periodOrders(mode){return data.filter(o=>o.completedAt&&!o.deleted).filter(o=>mode==="today"?isSameDay(o.completedAt):(new Date(o.completedAt)>=weekStart()&&new Date(o.completedAt)<new Date(weekStart().getTime()+7*86400000))).sort((a,b)=>b.completedAt-a.completedAt)}
function unionDuration(arr,a,b){let x=arr.map(v=>[Math.max(v.start,a),Math.min(v.end,b)]).filter(v=>v[1]>v[0]).sort((x,y)=>x[0]-y[0]),t=0,s=null,e=null;for(const v of x){if(s===null){s=v[0];e=v[1]}else if(v[0]<=e)e=Math.max(e,v[1]);else{t+=e-s;s=v[0];e=v[1]}}return t+(s===null?0:e-s)}
function workText(h){let sec=Math.round(h*3600),hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;return hh?`${hh}:${pad(mm)}`:`${pad(mm)}:${pad(ss)}`}
function render(){
  const list=active();
  $("status").textContent=`目前 ${list.length}/4 筆，還可增加 ${4-list.length} 筆`;
  $("orders").innerHTML=list.length?list.map(o=>{
    const platform=Number(o.baseFee||45);
    const actual=Math.max(platform,GUARANTEE*((Date.now()-o.start)/3600000));
    return `<div class="order">
      <div class="classicHead">
        <span class="badge">進行中</span><span class="ue">UE #${o.no}</span>
      </div>
      <div class="classicMetrics">
        <div class="metric">
          <small>已用時間</small>
          <strong class="timer" id="t-${o.id}">${fmt((Date.now()-o.start)/1000)}</strong>
        </div>
        <div class="metric platformMetric">
          <div><small>平台金額</small><strong class="platformPrice">NT$${platform.toFixed(0)}</strong></div>
          <button class="inlineEdit" type="button" onclick="editFee('${o.id}')" aria-label="修改平台金額">✎</button>
        </div>
        <div class="metric actualMetric">
          <small>實際時間金額</small>
          <strong class="actualPrice" id="a-${o.id}">NT$${actual.toFixed(0)}</strong>
        </div>
      </div>
      <div class="classicActions">
        <input class="note" aria-label="備註" placeholder="備註（店名等）" value="${esc(o.note||"")}" oninput="setNote('${o.id}',this.value)">
        <button class="delete" type="button" onclick="deleteOrder('${o.id}')">放棄此單</button>
        <button class="complete" type="button" onclick="complete('${o.id}')">配送完成</button>
      </div>
    </div>`;
  }).join(""):`<div class="empty">◷<br>按「開始計時」開始計算下一筆獨立訂單</div>`;
  updateToday();
  const startBtn=$("start");
  if(startBtn){
    const full=list.length>=4;
    startBtn.classList.toggle("isFull",full);
    startBtn.textContent=full?"已滿 4 筆":"◷ 開始計時";
    startBtn.disabled=false;
  }
}
function setNote(id,v){let o=data.find(x=>String(x.id)===String(id));if(o){o.note=v;save()}}
function toast(msg){
  const el=$("actionToast");
  if(!el)return;
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}
function todayStartTs(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function nextDailyOrderNo(){const start=todayStartTs();const nums=data.filter(o=>o&&!o.deleted&&Number(o.start)>=start).map(o=>Number(o.no)||0).filter(n=>n>0);return nums.length?Math.max(...nums)+1:1;}
function autoAddOrder(amount,eventId){
  if(!eventId)return false;
  const seenKey="delivery_auto_seen_v1";
  let seen=[];
  try{seen=JSON.parse(localStorage.getItem(seenKey)||"[]")}catch(e){seen=[]}
  if(seen.includes(eventId))return false;
  seen.push(eventId);
  if(seen.length>100)seen=seen.slice(-100);
  localStorage.setItem(seenKey,JSON.stringify(seen));
  if(active().length>=4)return false;
  const base=Math.max(45,Number(amount)||45);
  const no=nextDailyOrderNo();
  data.push({id:Date.now()+"_auto_"+Math.random(),no,start:Date.now(),baseFee:base,note:"",autoCaptured:true});
  save();render();
  return true;
}
function startOrder(){if(active().length>=4){toast("目前已滿 4 筆，請先完成或放棄一筆");return}let base=Math.max(45,Number($("baseFee").value)||45),no=nextDailyOrderNo();data.push({id:Date.now()+"_"+Math.random(),no,start:Date.now(),baseFee:base,note:""});save();render()}
function editFee(id){let o=data.find(x=>String(x.id)===String(id));if(!o)return;feeTarget=id;$("feeOrderLabel").textContent="UE #"+o.no;$("feeInput").value=o.baseFee||45;$("feeModal").style.display="flex";setTimeout(()=>{$("feeInput").focus();$("feeInput").select()},60)}
function closeFee(){$("feeModal").style.display="none";feeTarget=null}
function saveFee(){let o=data.find(x=>String(x.id)===String(feeTarget)),v=Number($("feeInput").value);if(!o||!Number.isFinite(v)||v<45)return;o.baseFee=v;save();closeFee();render()}
function deleteOrder(id){abandonTarget=id;$("abandonModal").style.display="flex"}
function complete(id){let o=data.find(x=>String(x.id)===String(id));if(!o)return;o.completedAt=Date.now();o.finalFee=Math.max(Number(o.baseFee||45),GUARANTEE*((o.completedAt-o.start)/3600000));o.pendingFee=Math.max(0,o.finalFee-Number(o.baseFee||45));save();render()}
function updateToday(){
 let d=data.filter(o=>o.completedAt&&!o.deleted&&new Date(o.completedAt).toDateString()===new Date().toDateString()),income=0,pending=0;
 d.forEach(o=>{let base=Number(o.baseFee||45),f=Number.isFinite(Number(o.finalFee))?Number(o.finalFee):Math.max(base,GUARANTEE*((o.completedAt-o.start)/3600000));income+=f;pending+=Math.max(0,f-base)});
 let day0=new Date();day0.setHours(0,0,0,0);let day1=new Date(day0);day1.setDate(day1.getDate()+1);let ints=data.filter(o=>!o.deleted&&o.start).map(o=>({start:Number(o.start),end:o.completedAt?Number(o.completedAt):Date.now()}));$("todayIncome").textContent="NT$"+Math.round(income);$("todayPending").textContent="NT$"+Math.round(pending);$("todayWorkTime").textContent=workText(unionDuration(ints,day0.getTime(),day1.getTime())/3600000);$("count").textContent=d.length}
function showHistory(mode=historyMode){historyMode=mode;$("todayTab").classList.toggle("active",mode==="today");$("weekTab").classList.toggle("active",mode==="week");$("periodDate").textContent=mode==="today"?dateText(selectedDate):"本週　"+dateText(weekStart())+" ～ "+dateText(new Date(weekStart().getTime()+6*86400000));let done=periodOrders(mode);let income=0,pending=0;done.forEach(o=>{let base=Number(o.baseFee||45),f=Math.max(base,GUARANTEE*((o.completedAt-o.start)/3600000));income+=f;pending+=Math.max(0,f-base)});let a=weekStart(),b=new Date(a.getTime()+7*86400000);if(mode==="today"){a=new Date(selectedDate);a.setHours(0,0,0,0);b=new Date(a);b.setDate(b.getDate()+1)}let ints=done.map(o=>({start:Math.max(Number(o.start),a.getTime()),end:Math.min(Number(o.completedAt),b.getTime())}));$("statPeriodLabel").textContent=mode==="today"?"本日收入":"本週收入";$("statIncome").textContent="NT$"+Math.round(income);$("statHoursLabel").textContent=mode==="today"?"今天工作時間":"本週工作時間";$("statHours").textContent=workText(unionDuration(ints,a.getTime(),b.getTime())/3600000);$("periodLabel").textContent=mode==="today"?"本日待補金額":"本週待補金額";$("periodIncome").textContent="NT$"+Math.round(pending);$("periodCount").textContent=done.length+" 筆";let last="";$("historyList").innerHTML=done.length?done.map(o=>{let day=new Date(o.completedAt).toLocaleDateString("zh-TW"),head=day!==last?(last=day,`<div class="day">${day}</div>`):"",st=new Date(o.start).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}),en=new Date(o.completedAt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}),base=Number(o.baseFee||45),f=Math.max(base,GUARANTEE*((o.completedAt-o.start)/3600000));return `${head}<div class="hist"><span class="histOrder">UE #${o.no}<small>${st}－${en}${o.note?"　"+esc(o.note):""}</small></span><span class="histDuration"><small>實際時間</small><strong>${fmt((o.completedAt-o.start)/1000)}</strong></span><span class="histMoney"><small>平台金額</small><b>NT$${base.toFixed(0)}</b><em>→</em><small>實際收入</small><strong>NT$${f.toFixed(1)}</strong></span><button class="histDelete" onclick="deleteHistory('${o.id}')">刪除</button></div>`}).join(""):`<div class="empty" style="height:180px">目前沒有符合條件的歷史訂單</div>`;$("modal").style.display="flex"}
function deleteHistory(id){let o=data.find(x=>String(x.id)===String(id));if(!o)return;historyDeleteTarget=id;$("historyDeleteText").textContent=`確定要刪除 UE #${o.no} 這一筆歷史訂單嗎？`;$("historyDeleteModal").style.display="flex"}
function shiftDate(n){selectedDate.setDate(selectedDate.getDate()+n);showHistory(historyMode)}
$("start").onclick=startOrder;$("history").onclick=()=>showHistory("today");$("close").onclick=()=>$("modal").style.display="none";$("prevDate").onclick=()=>shiftDate(historyMode==="today"?-1:-7);$("nextDate").onclick=()=>shiftDate(historyMode==="today"?1:7);$("backToday").onclick=()=>{selectedDate=new Date();selectedDate.setHours(0,0,0,0);showHistory(historyMode)};$("todayTab").onclick=()=>showHistory("today");$("weekTab").onclick=()=>showHistory("week");$("abandonCancel").onclick=()=>{$("abandonModal").style.display="none";abandonTarget=null};$("abandonYes").onclick=()=>{let o=data.find(x=>String(x.id)===String(abandonTarget));if(o)o.deleted=true;save();$("abandonModal").style.display="none";abandonTarget=null;render()};$("historyDeleteCancel").onclick=()=>{$("historyDeleteModal").style.display="none";historyDeleteTarget=null};$("historyDeleteYes").onclick=()=>{let o=data.find(x=>String(x.id)===String(historyDeleteTarget));if(o)o.deleted=true;save();$("historyDeleteModal").style.display="none";historyDeleteTarget=null;showHistory(historyMode);render()};$("feeCancel").onclick=closeFee;$("feeSave").onclick=saveFee;
setInterval(()=>{
  active().forEach(o=>{
    const elapsed=(Date.now()-o.start)/1000;
    const t=$("t-"+o.id);
    const a=$("a-"+o.id);
    if(t)t.textContent=fmt(elapsed);
    if(a)a.textContent="NT$"+Math.max(Number(o.baseFee||45),GUARANTEE*(elapsed/3600)).toFixed(0);
  });
  updateToday();
},500);
render();
</script>
</body>
</html>
